<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - PadelRank</title>

    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='images/logo.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<header class="navbar">

    <div class="logo">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="PadelRank"
        >

    </div>


    <nav>

        <a href="/">
            Accueil
        </a>

        <a href="/simulation">
            Simulateur
        </a>

        <a href="/classement">
            Classement
        </a>

        <a href="#">
            À propos
        </a>

    </nav>


    <a href="/connexion" class="connexion">
        Se connecter
    </a>

</header>



<main class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">

            <img
                src="{{ url_for('static', filename='images/logo.png') }}"
                alt="PadelRank"
            >

        </div>


        <div class="auth-header">

            <span class="sur-titre">
                PADELRANK
            </span>

            <h1>
                Créer un compte
            </h1>

            <p>
                Crée ton compte pour retrouver tes simulations
                et ton évolution.
            </p>

        </div>


        {% if erreur %}

        <div class="message-erreur">
            {{ erreur }}
        </div>

        {% endif %}


        <form method="POST">


            <div class="form-row">


                <div class="form-groupe">

                    <label for="prenom">
                        Prénom
                    </label>

                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        placeholder="Ex : Lucas"
                        value="{{ prenom or '' }}"
                        required
                    >

                </div>


                <div class="form-groupe">

                    <label for="nom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        placeholder="Ex : Martin"
                        value="{{ nom or '' }}"
                        required
                    >

                </div>


            </div>



            <div class="form-groupe">

                <label for="email">
                    Adresse email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemple@email.com"
                    value="{{ email or '' }}"
                    required
                >

            </div>



            <div class="form-groupe">

                <label for="mot_de_passe">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="mot_de_passe"
                    name="mot_de_passe"
                    placeholder="••••••••"
                    required
                >

            </div>



            <div class="form-groupe">

                <label for="confirmation">

                    Confirmer le mot de passe

                </label>

                <input
                    type="password"
                    id="confirmation"
                    name="confirmation"
                    placeholder="••••••••"
                    required
                >

            </div>



            <button
                type="submit"
                class="bouton-principal bouton-auth"
            >

                Créer mon compte

            </button>


        </form>



        <div class="auth-footer">

            <p>
                Tu as déjà un compte ?
            </p>

            <a href="/connexion">
                Se connecter
            </a>

        </div>


    </div>


</main>



<footer>

    <p>
        © 2026 PadelRank — Simulateur de points FFT
    </p>

</footer>


</body>

</html>
